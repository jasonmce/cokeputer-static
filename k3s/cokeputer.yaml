apiVersion: v1
kind: Namespace
metadata:
  name: cokeputer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cokeputer
  namespace: cokeputer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cokeputer
  template:
    metadata:
      labels:
        app: cokeputer
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/library/cokeputer-static:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cokeputer
  namespace: cokeputer
spec:
  selector:
    app: cokeputer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: require-https
  namespace: cokeputer
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cokeputer-http
  namespace: cokeputer
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cokeputer-require-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cokeputer.bso.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cokeputer
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cokeputer-https
  namespace: cokeputer
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cokeputer.bso.io
      secretName: cokeputer-tls
  rules:
    - host: cokeputer.bso.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cokeputer
                port:
                  number: 80
